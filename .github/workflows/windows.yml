name: Windows build

on:
  push:
    paths:
      - 'windows/**'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: "Release tag to attach the zip to (e.g. V26.11.12). Empty = nothing is published."
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only needed to attach the zip to an existing release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version YY.MM.XX counts the commits of the month

      - name: Version
        shell: bash
        env:
          TZ: Europe/Paris   # same month boundaries as local builds
        run: echo "VERSION=$(./version.sh --plain)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S windows -B build -A x64 -DSIMPLEPLUG_VERSION=${{ env.VERSION }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $name = "SimplePlug-V$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item build/SimplePlug_artefacts/Release/SimplePlug.exe "dist/$name/"
          Copy-Item windows/README.md, windows/LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: SimplePlug-windows-x64
          path: dist/*.zip

      - name: Attach to the release
        if: ${{ inputs.attach_to_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.attach_to_tag }}
        run: gh release upload "$env:TAG" "$env:ZIP" --clobber
